name: Build PurOS ISO

on:
  workflow_dispatch:
    inputs:
      iso_name:
        description: "Имя файла образа (латиницей)"
        required: false
        default: "puros"
      build_furrboot:
        description: "Собрать графическое UEFI-меню (Rust)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Bootable PurOS (.ISO)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space on GitHub runner (~35 GB extra)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout PurOS repository
        uses: actions/checkout@v4

      - name: Build PurOS ISO inside official Arch Linux container
        env:
          ISO_NAME_INPUT: ${{ inputs.iso_name || 'puros' }}
          FURRBOOT_INPUT: ${{ inputs.build_furrboot == false && '0' || '1' }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${GITHUB_WORKSPACE}/out:/out" \
            -e CUSTOM_ISO_NAME="${ISO_NAME_INPUT}" \
            -e BUILD_FURRBOOT="${FURRBOOT_INPUT}" \
            -e BUILD_AUR_WALLS="1" \
            -e OUT_DIR="/out" \
            archlinux:latest bash -lc '
              set -euo pipefail
              rm -rf /var/tmp/puros-src
              mkdir -p /var/tmp/puros-src
              cp -a /src/. /var/tmp/puros-src/
              find /var/tmp/puros-src/tools -type f -exec sed -i "s/\r$//" {} +
              chmod +x /var/tmp/puros-src/tools/*.sh
              bash /var/tmp/puros-src/tools/build.sh /var/tmp/puros-src
            '
          ls -lh "${GITHUB_WORKSPACE}/out"

      - name: Split ISO if larger than 1.95 GiB (for GitHub Releases limit)
        run: |
          cd "${GITHUB_WORKSPACE}/out"
          for iso in *.iso; do
            size=$(stat -c%s "$iso")
            if (( size > 2090000000 )); then
              split -b 1950M -d -a 2 "$iso" "${iso}.part"
            fi
          done
          ls -lh

      - name: Upload PurOS ISO to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PurOS-ISO
          path: |
            out/*.iso
            out/*.iso.part*
            out/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.sha256
            out/*.iso.part*
            out/*.iso
          fail_on_unmatched_files: false
